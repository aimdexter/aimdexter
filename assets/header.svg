<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .l{animation:in .5s ease both}
    .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.1s}
    .d4{animation-delay:1.5s}.d5{animation-delay:2s}.d6{animation-delay:2.4s}
    @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .node{animation:pulse 3.2s ease-in-out infinite}
    .n2{animation-delay:.8s}.n3{animation-delay:1.6s}.n4{animation-delay:2.4s}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    .edge{stroke-dasharray:3 7;animation:flow 5s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-100}}
    .ring{transform-origin:1062px 238px;animation:ping 2.4s ease-out infinite}
    @keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(2.2);opacity:0}}
  </style>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="55%" r="45%">
      <stop offset="0" stop-color="#39c5cf" stop-opacity=".10"/>
      <stop offset="1" stop-color="#39c5cf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0d1117"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- window bar -->
    <rect width="1200" height="38" fill="#161b22"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#30363d"/>
    <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="19" r="6" fill="#27c93f"/>
    <text x="600" y="24" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">aimdexter@ensmr: ~</text>

    <!-- terminal content -->
    <g class="mono">
      <text x="48" y="92" font-size="18" class="l d1"><tspan fill="#3fb950">~</tspan><tspan fill="#8b949e"> $ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
      <text x="46" y="152" font-size="54" font-weight="700" fill="#e6edf3" class="l d2">aimdexter</text>
      <text x="48" y="192" font-size="20" fill="#39c5cf" class="l d3">PhD Researcher · ENSMR, Rabat</text>
      <text x="48" y="224" font-size="16" fill="#8b949e" class="l d4">security  /  devops  /  software engineering</text>
      <text x="48" y="276" font-size="18" class="l d5"><tspan fill="#3fb950">~</tspan><tspan fill="#8b949e"> $ </tspan><tspan fill="#e6edf3">./status --now</tspan></text>
      <text x="48" y="306" font-size="16" fill="#c9d1d9" class="l d6">researching · building · auditing<tspan fill="#3fb950" font-weight="700" class="cur"> _</tspan></text>
    </g>

    <!-- infrastructure / threat map -->
    <g stroke="#30363d" stroke-width="1.5" fill="none">
      <line class="edge" x1="820" y1="110" x2="930" y2="90" stroke="#39c5cf"/>
      <line class="edge" x1="930" y1="90" x2="1060" y2="120" stroke="#39c5cf"/>
      <line class="edge" x1="820" y1="110" x2="880" y2="200"/>
      <line class="edge" x1="930" y1="90" x2="960" y2="190" stroke="#39c5cf"/>
      <line class="edge" x1="1060" y1="120" x2="1140" y2="190"/>
      <line class="edge" x1="880" y1="200" x2="960" y2="190"/>
      <line class="edge" x1="960" y1="190" x2="1062" y2="238" stroke="#f85149"/>
      <line class="edge" x1="1140" y1="190" x2="1062" y2="238"/>
      <line class="edge" x1="880" y1="200" x2="930" y2="285"/>
      <line class="edge" x1="1062" y1="238" x2="1010" y2="300"/>
      <line class="edge" x1="930" y1="285" x2="1010" y2="300"/>
    </g>

    <g class="mono" font-size="11" fill="#8b949e">
      <circle class="node" cx="820" cy="110" r="7" fill="#39c5cf"/><text x="800" y="94">edge</text>
      <circle class="node n2" cx="930" cy="90" r="9" fill="#39c5cf"/><text x="914" y="72">lb</text>
      <circle class="node n3" cx="1060" cy="120" r="7" fill="#39c5cf"/><text x="1048" y="104">k8s</text>
      <circle class="node n4" cx="880" cy="200" r="6" fill="#3fb950"/><text x="852" y="224">ci/cd</text>
      <circle class="node" cx="960" cy="190" r="8" fill="#39c5cf"/><text x="972" y="184">api</text>
      <circle class="node n2" cx="1140" cy="190" r="6" fill="#3fb950"/><text x="1122" y="174">mon</text>
      <circle class="node n3" cx="930" cy="285" r="6" fill="#3fb950"/><text x="904" y="310">db</text>
      <circle class="node n4" cx="1010" cy="300" r="6" fill="#3fb950"/><text x="1002" y="324">ids</text>
      <circle class="ring" cx="1062" cy="238" r="10" fill="none" stroke="#f85149" stroke-width="2"/>
      <circle cx="1062" cy="238" r="7" fill="#f85149"/><text x="1078" y="252" fill="#f85149">alert</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="14" fill="none" stroke="#30363d"/>
</svg>
